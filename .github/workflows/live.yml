name: Live players
# Who is online and where players are (every 20 seconds while someone plays), and whether a new version of Blockmap is
# out. Everything this does is in tools/ci/run.sh: this file never needs to change (see map.yml).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Let a running check finish (a newer request waits) so that frequent triggers never cancel every run.
concurrency:
  group: live-players
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          git clone -q --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" blockmap
          cd blockmap
          bash tools/ci/run.sh live
