name: Live players

# Who is online and where players are. While someone plays, one run keeps checking every 20 seconds.
# GitHub's own timer is unreliable, so an outside timer may also start this through workflow_dispatch.
# Each look goes to the members-only site on Cloudflare (pages ask it every few seconds) and, encrypted, to the
# live-data branch (where the next run and the map drawing pick it up).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  BLOCKMAP_LANG: ${{ vars.LANGUAGE || 'ja' }}

concurrency:
  group: live-players
  # Let a running check finish (a newer request waits) so that frequent triggers never cancel every run.
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Get the key
        run: bash tools/realms_key.sh
        env:
          REALMS_CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # optional: otherwise kept in the site's Cloudflare database
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - name: Start signing in if this new site has not yet
        run: bash tools/auto_signin.sh
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Who is online and where (every 20 seconds while someone plays)
        run: bash tools/live_loop.sh
        env:
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
          SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save the refreshed sign-in
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
