name: 共有サーバー

# Sets up (and updates) the small Cloudflare server that keeps everyone's pins and drawings.
# Needs three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, SHARE_PASSPHRASE.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['share/**', '.github/workflows/share.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: share-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}
    steps:
      - name: 設定の確認
        id: check
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$SHARE_PASSPHRASE" ] || missing="$missing SHARE_PASSPHRASE"
          if [ -n "$missing" ]; then
            echo "::warning::まだ設定されていない Secrets があります:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: 準備
        if: steps.check.outputs.ready == 'true'
        working-directory: share
        run: npm ci --no-audit --no-fund

      - name: データベースを用意
        if: steps.check.outputs.ready == 'true'
        working-directory: share
        run: |
          find_db() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="blockmap-share");process.stdout.write(d?d.uuid:"")})'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create blockmap-share
            id=$(find_db)
          fi
          [ -n "$id" ] || { echo "::error::データベースを作れませんでした"; exit 1; }
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sed -e "s/__DB_ID__/$id/" -e "s#__ORIGINS__#https://$owner.github.io#" wrangler.template.toml > wrangler.toml
          npx wrangler d1 execute blockmap-share --remote --file schema.sql --yes

      - name: サーバーを公開
        if: steps.check.outputs.ready == 'true'
        id: deploy
        working-directory: share
        run: |
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          [ -n "$url" ] || { echo "::error::公開先のアドレスがわかりませんでした。Cloudflare の画面で「Workers & Pages」を一度開いて workers.dev のサブドメインを決めてから、もう一度実行してください"; exit 1; }
          printf '%s' "$SHARE_PASSPHRASE" | npx wrangler secret put PASSPHRASE
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "共有サーバー: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: サイトに共有先を設定
        if: steps.check.outputs.ready == 'true'
        env:
          SHARE_URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          with open('config.json', encoding='utf-8') as f:
              cfg = json.load(f)
          if cfg.get('shareUrl') == os.environ['SHARE_URL']:
              raise SystemExit
          cfg['shareUrl'] = os.environ['SHARE_URL']
          with open('config.json', 'w', encoding='utf-8') as f:
              json.dump(cfg, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          if ! git diff --quiet config.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "共有サーバーのアドレスを設定" config.json
            git push
            gh workflow run map.yml -f action=サイトだけ公開
          fi
