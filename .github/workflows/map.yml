name: Map site
# A run started by hand is titled by what it does ("Sign in to Realms", "Update map"), which also lets the live check
# and the setup page tell a sign-in apart. Other runs keep GitHub's usual title.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.action || '' }}

# Runs only on this repository's own main branch, schedule, or manual start.
# There is deliberately no pull_request trigger, so outside contributions never see the login secret.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        # Signing in comes first when setting up, so it is the default; the map updates by itself after that.
        options: [Sign in to Realms, Update map, Publish site only, Diagnose]
        default: Sign in to Realms

permissions:
  contents: read

# GitHub keeps only one waiting run per group, so a push (publishing new site code) gets its own group: a map update
# queued behind it can no longer drop it. Map updates still run one at a time.
concurrency:
  group: map-site-${{ github.event_name == 'push' && 'push' || 'map' }}
  cancel-in-progress: false

env:
  # Repository variables (Settings → Secrets and variables → Actions → Variables), both optional:
  # LANGUAGE "en" for English messages in these runs (Japanese if not set); TIMEZONE for the map's dates
  # (e.g. America/New_York; Asia/Tokyo if not set).
  BLOCKMAP_LANG: ${{ vars.LANGUAGE || 'ja' }}
  TZ: ${{ vars.TIMEZONE || 'Asia/Tokyo' }}
  # What a run started by hand does (empty otherwise): runs that tell the setup page how they are getting on.
  BLOCKMAP_ACTION: ${{ inputs.action }}

jobs:
  login:
    # After the site is put up (the "cloudflare" job, only the first time), so the setup page can follow the sign-in
    # through it. Signing in goes ahead even if that did not work.
    needs: [cloudflare]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.action == 'Sign in to Realms'
    runs-on: ubuntu-latest
    timeout-minutes: 35  # up to 15 minutes to enter the code, and up to 15 more to pick a Realm when there are several
    permissions:
      contents: write  # the "login-code" branch the setup page reads the code from
      actions: write   # to start "Update map" once signed in
    steps:
      - uses: actions/checkout@v4
      - name: Get the key
        run: bash tools/realms_key.sh --required
        env:
          REALMS_CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # optional: otherwise kept in the site's Cloudflare database
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Tell the setup page
        run: bash tools/setup_status.sh starting
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Sign in to Realms (enter the code shown below)
        run: node tools/realms/login.js
        env:
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
          GH_TOKEN: ${{ github.token }}
      # Kept even when no Realm could be chosen yet (REALM_NAME can be set afterwards without signing in again).
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.auth/token.enc') != ''
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
      # Signed in: make the map right away, so setting up needs no second run.
      - name: Start making the map
        run: |
          gh workflow run map.yml --ref "$GITHUB_REF_NAME" -f action='Update map'
          # And the first live check now (GitHub's 10-minute timer can take a while to start in a new repository): it
          # tells the site who the members are, so the owner and members can sign in to it.
          gh workflow run live.yml --ref "$GITHUB_REF_NAME" || true
          if [ "$BLOCKMAP_LANG" != en ]; then echo "地図を作り始めました。数分でサイトができます"; else echo "Started making the map. The site is ready in a few minutes"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tell the setup page it did not work
        if: failure()
        run: bash tools/setup_status.sh login-failed
      - name: Clear the sign-in code
        if: always()
        run: bash tools/login_code.sh clear
        env:
          GH_TOKEN: ${{ github.token }}

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'Diagnose'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Get the key
        run: bash tools/realms_key.sh
        env:
          REALMS_CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # optional: otherwise kept in the site's Cloudflare database
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Look at the Realm's members
        run: node tools/realms/inspect.js
        env:
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - name: Download the world
        run: node tools/realms/download.js world.mcworld members.json
        env:
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
      - name: Look at the players in the world
        env:
          CHECK: ${{ vars.CHECK_SPOT }}
        run: |
          pip install --quiet numpy pillow
          python3 tools/inspect_world.py world.mcworld

  update:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == 'Update map')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write  # to keep the timers on (below)
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      # GitHub turns off the timers of a public repository after 60 days without changes, and a copy of Blockmap may
      # never change. Once a day, switching them on again keeps the map and the live check running.
      - name: Keep the timers on
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = 03 ]; then
            for wf in map.yml live.yml; do gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/enable" >/dev/null && echo "on: $wf"; done
          fi
      - name: Get the key
        run: bash tools/realms_key.sh
        env:
          REALMS_CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # optional: otherwise kept in the site's Cloudflare database
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Download the world from Realms
        id: download
        # Before the first "Sign in to Realms" there is nothing to do yet: say so, without failing every hour.
        run: |
          if [ ! -f .auth/token.enc ] || [ -z "$CACHE_KEY" ]; then
            if [ "$BLOCKMAP_LANG" != en ]; then echo "::notice::まだ「Sign in to Realms」をしていないので、地図は作りません(Actions の「Map site」から実行してください)"
            else echo "::notice::Not signed in to Realms yet, so no map is made (run \"Sign in to Realms\" from \"Map site\" in Actions)"; fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          bash tools/setup_status.sh downloading
          node tools/realms/download.js world.mcworld members.json
        env:
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - name: Save the refreshed sign-in
        if: steps.download.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
      - name: Get the previous map data
        if: steps.download.outputs.ready == 'true'
        run: bash tools/vault.sh get map-data data
      # Each of the Realm's worlds (slots) has its own map: the one being played is drawn into its own folder.
      - name: Which world is being played
        id: world
        if: steps.download.outputs.ready == 'true'
        run: python3 tools/worlds.py target data members.json
      - name: Check whether the world or the drawing code changed
        id: compare
        if: steps.download.outputs.ready == 'true'
        # Fingerprint = world + drawing code, so a color fix re-renders even if nobody played. Switching to another
        # world always publishes, so the site opens on the world now played.
        env:
          DIR: ${{ steps.world.outputs.dir }}
          SWITCHED: ${{ steps.world.outputs.switched }}
        run: |
          echo "${{ steps.download.outputs.world_hash }}-$(cat tools/*.py | sha256sum | cut -c1-64)" > fingerprint.txt
          if [ "$SWITCHED" != true ] && [ -f "$DIR/world.sha256" ] && [ "$(cat "$DIR/world.sha256")" = "$(cat fingerprint.txt)" ]; then
            echo "No change since last time"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            bash tools/setup_status.sh done
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Make the map
        if: steps.compare.outputs.changed == 'true'
        env:
          DIR: ${{ steps.world.outputs.dir }}
        run: |
          bash tools/setup_status.sh drawing
          pip install --quiet numpy pillow
          live=""
          bash tools/vault.sh get live-data live
          [ -f live/live.json ] && live=live/live.json
          mkdir -p "$DIR"
          python tools/render_map.py --world world.mcworld --site "$DIR" --snapshot "$(date +%F)" --live "$live"
          cp fingerprint.txt "$DIR/world.sha256"
          python3 tools/worlds.py record data members.json
      - name: Save the map data (encrypted)
        if: steps.compare.outputs.changed == 'true'
        # map-data keeps a single commit so the repository does not grow with every hourly update.
        run: bash tools/vault.sh put data map-data
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tell the setup page it did not work
        if: failure()
        run: bash tools/setup_status.sh map-failed

  # The invite-only site on Cloudflare (worker/): the site, the map data in a hidden folder, and the shared pins.
  cloudflare:
    needs: [update]
    if: >-
      always() && !cancelled() && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'Publish site only') ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'Sign in to Realms') ||
        needs.update.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # the "site-info" branch that tells the setup page the site's address
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}  # optional: made from the key when not set
    steps:
      - uses: actions/checkout@v4
      - name: Check the settings
        id: check
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            # Signing in puts the site up first (empty until the map is made) so the setup page can follow along
            # through it; once there is a site, signing in leaves it as it is.
            if [ "$BLOCKMAP_ACTION" = 'Sign in to Realms' ]; then
              account=$(bash tools/cloudflare.sh account)
              there=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts/$(bash tools/site_name.sh)/settings" || true)
              if [ "$there" = 200 ]; then
                echo "ready=false" >> "$GITHUB_OUTPUT"
                if [ "$BLOCKMAP_LANG" != en ]; then echo "サイトはもうあるので、そのままログインします"; else echo "The site is already there, so signing in goes ahead"; fi
              elif [ "$BLOCKMAP_LANG" != en ]; then echo "先にサイトを用意します(地図は、ログインの後に作ります)"
              else echo "Putting the site up first (the map is made after signing in)"; fi
            fi
          else
            if [ "$BLOCKMAP_LANG" != en ]; then echo "::warning::Cloudflare の Secrets がそろっていないので、サイトは作りません"
            else echo "::warning::The Cloudflare secrets are not all set, so the site is not published"; fi
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Get the key
        if: steps.check.outputs.ready == 'true'
        run: bash tools/realms_key.sh
        env:
          REALMS_CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # optional: otherwise kept in the site's Cloudflare database
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # CLOUDFLARE_ACCOUNT_ID may be left out: the token's account is used. A new account gets a workers.dev name
      # (its GitHub owner's name) if it has none yet.
      - name: Find the Cloudflare account
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! bash tools/cloudflare.sh export >/dev/null; then
            if [ "$BLOCKMAP_LANG" != en ]; then echo "::error::Cloudflare のアカウントが見つかりませんでした。CLOUDFLARE_API_TOKEN を確かめてください"
            else echo "::error::Could not find the Cloudflare account. Check CLOUDFLARE_API_TOKEN"; fi
            exit 1
          fi
          sub=$(bash tools/cloudflare.sh subdomain "$GITHUB_REPOSITORY_OWNER")
          [ -n "$sub" ] && echo "workers.dev: $sub"
      - name: Make the keys (masked in the log)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/site_keys.py "$RUNNER_TEMP"
      - name: Get the map data
        if: steps.check.outputs.ready == 'true'
        run: bash tools/vault.sh get map-data data
      - name: Gather the site files
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/build_site.py data _site --data-folder "$(cat "$RUNNER_TEMP/data_dir")" --items-folder "$(cat "$RUNNER_TEMP/items_dir")"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm ci --prefix worker --no-audit --no-fund
      - name: Prepare the database
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          name=$(bash ../tools/site_name.sh); db=$(bash ../tools/site_name.sh --db)
          find_db() { npx wrangler d1 list --json | DB="$db" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name===process.env.DB);process.stdout.write(d?d.uuid:"")})'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create "$db"
            id=$(find_db)
          fi
          [ -n "$id" ] || { echo "::error::Could not create the database"; exit 1; }
          sed -e "s/__DB_ID__/$id/; s/__DB_NAME__/$db/; s/__NAME__/$name/" wrangler.template.toml > wrangler.toml
          npx wrangler d1 execute "$db" --remote --file schema.sql --yes
      - name: Publish to Cloudflare
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          GITHUB_TOKEN_FOR_INFO: ${{ github.token }}
        run: |
          if [ "$BLOCKMAP_ACTION" = 'Update map' ]; then bash ../tools/setup_status.sh publishing; fi
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          if [ -z "$url" ]; then
            if [ "$BLOCKMAP_LANG" != en ]; then echo "::error::公開先のアドレスがわかりませんでした。Cloudflare の画面で「Workers & Pages」を一度開いて workers.dev のサブドメインを決めてから、もう一度実行してください"
            else echo "::error::Could not find the site's address. Open Workers & Pages in Cloudflare once, choose a workers.dev subdomain, then run this again"; fi
            exit 1
          fi
          if [ "$BLOCKMAP_LANG" != en ]; then echo "サイト: $url" >> "$GITHUB_STEP_SUMMARY"; else echo "Site: $url" >> "$GITHUB_STEP_SUMMARY"; fi
          GH_TOKEN="$GITHUB_TOKEN_FOR_INFO" bash ../tools/info_branch.sh put site-info site.json "{\"url\":\"$url\"}"
          if [ "$BLOCKMAP_ACTION" = 'Update map' ]; then SITE_URL="$url" bash ../tools/setup_status.sh "{\"state\":\"done\",\"url\":\"$url\"}"; fi
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: Tell the setup page it did not work
        if: failure() && env.BLOCKMAP_ACTION == 'Update map'
        run: bash tools/setup_status.sh map-failed
      - name: Remove the earlier sites
        # This site's earlier workers: the first pin server (blockmap-share) and the name the members-only site had
        # for a while (map.<subdomain>.workers.dev). Only the workers go; the database stays. Only for this repository,
        # so nobody else's worker of the same name is touched.
        if: steps.check.outputs.ready == 'true' && github.repository == 'tsow9/minecraft_be_livemap'
        continue-on-error: true
        run: |
          for old in blockmap-share map; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$old")
            case "$code" in
              200) echo "Removed the earlier site ($old)" ;;
              404) echo "The earlier site ($old) is already gone" ;;
              *) echo "::warning::Could not remove the earlier site ($old): $code" ;;
            esac
          done
      - name: Sign-ins (counts only)
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        continue-on-error: true
        run: |
          # How many sign-ins were made each day, and how many devices stay signed in. Counts only, nobody's name or id.
          npx wrangler d1 execute "$(bash ../tools/site_name.sh --db)" --remote --json --command \
            "SELECT date(created / 1000, 'unixepoch') AS day, COUNT(*) AS n FROM sessions GROUP BY day ORDER BY day DESC LIMIT 14" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s)[0].results;console.log("Sign-ins per day:");for(const x of r)console.log(`  ${x.day}: ${x.n}`)})'

  # GitHub Pages keeps only two pages: a notice that the map has moved (to the members-only site on Cloudflare), and
  # login.html, the page every Blockmap site's Microsoft sign-in comes back through. No map data is published here.
  # Only in this project's own repository: copies have no GitHub Pages and need none.
  deploy:
    if: >-
      github.repository == 'tsow9/minecraft_be_livemap' && (
        github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'Publish site only')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Gather the site files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir _site
          cp login.html privacy.html terms.html legal.css legal.js setup.html setup.css setup.js favicon.svg _site/
          # Browsers may keep GitHub Pages files for 10 minutes: name each script and style by this version.
          v=${GITHUB_SHA::8}
          sed -i -E "s/(href|src)=\"(setup|legal)\.(css|js)\"/\1=\"\2.\3?v=$v\"/g" _site/setup.html _site/privacy.html _site/terms.html
          url=$(bash tools/site_url.sh)
          sed "s#__SITE__#${url:-}#" tools/moved.html > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Another deployment may still be finishing; wait a little and try again instead of failing.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Try publishing again
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
