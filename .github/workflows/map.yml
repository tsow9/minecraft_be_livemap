name: 地図サイト

# Runs only on this repository's own main branch, schedule, or manual start.
# There is deliberately no pull_request trigger, so outside contributions never see the login secret.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: やること
        type: choice
        options: [地図を更新, Realmsにログイン, サイトだけ公開, 診断]
        default: 地図を更新

permissions:
  contents: read

concurrency:
  group: map-site
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  login:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'Realmsにログイン'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Realmsにログイン(下に出るコードを入力してください)
        run: node tools/realms/login.js
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.action == '診断'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Realmsのメンバー情報を調べる
        run: node tools/realms/inspect.js
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - name: ワールドをダウンロード
        run: node tools/realms/download.js world.mcworld members.json
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
      - name: ワールドの中のプレイヤー情報を調べる
        env:
          CHECK: ${{ vars.CHECK_SPOT }}
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # to compare hashed account IDs with the members' (only counts are shown)
        run: |
          pip install --quiet numpy pillow
          python3 tools/inspect_world.py world.mcworld

  update:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == '地図を更新')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Realmsからワールドをダウンロード
        id: download
        run: node tools/realms/download.js world.mcworld members.json
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - name: 新しくなったログイン情報を保存
        uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
      - name: 前回の地図データを取得
        run: |
          mkdir -p data
          if git fetch --depth 1 origin map-data; then git archive FETCH_HEAD | tar -x -C data; fi
      - name: ワールドか地図の描き方が変わったか確認
        id: compare
        # Fingerprint = world + drawing code, so a color fix re-renders even if nobody played.
        run: |
          echo "${{ steps.download.outputs.world_hash }}-$(cat tools/*.py | sha256sum | cut -c1-64)" > fingerprint.txt
          if [ -f data/world.sha256 ] && [ "$(cat data/world.sha256)" = "$(cat fingerprint.txt)" ]; then
            echo "前回から変化なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 地図を作る
        if: steps.compare.outputs.changed == 'true'
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # pet owners are stored as the same hashed keys live.json uses
        run: |
          pip install --quiet numpy pillow
          live=""
          if git fetch --depth 1 origin live-data; then git show FETCH_HEAD:live.json > live.json && live=live.json; fi
          python tools/render_map.py --world world.mcworld --site data --snapshot "$(date +%F)" --live "$live"
          cp fingerprint.txt data/world.sha256
      - name: 地図データを保存
        if: steps.compare.outputs.changed == 'true'
        # map-data keeps a single commit so the repository does not grow with every hourly update.
        run: |
          cd data
          git init -q -b map-data
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "地図データ $(date '+%F %H:%M')"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" map-data
        env:
          GH_TOKEN: ${{ github.token }}

  # The invite-only site on Cloudflare (worker/): the site, the map data in a hidden folder, and the shared pins.
  cloudflare:
    needs: [update]
    if: >-
      always() && !cancelled() && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'サイトだけ公開') ||
        needs.update.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}
      CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
    steps:
      - name: 設定の確認
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$SHARE_PASSPHRASE" ] && [ -n "$CACHE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare の Secrets がそろっていないので、招待制のサイトは作りません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: 鍵を用意(ログには伏せ字で出ます)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/site_keys.py "$RUNNER_TEMP"
      - name: 地図データを取得
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p data
          if git fetch --depth 1 origin map-data; then git archive FETCH_HEAD | tar -x -C data; fi
      - name: 公開するファイルをまとめる
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/build_site.py data _site --data-folder "$(cat "$RUNNER_TEMP/data_dir")"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: 準備
        if: steps.check.outputs.ready == 'true'
        run: npm ci --prefix worker --no-audit --no-fund
      - name: データベースを用意
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          find_db() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="blockmap-share");process.stdout.write(d?d.uuid:"")})'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create blockmap-share
            id=$(find_db)
          fi
          [ -n "$id" ] || { echo "::error::データベースを作れませんでした"; exit 1; }
          sed -e "s/__DB_ID__/$id/" wrangler.template.toml > wrangler.toml
          npx wrangler d1 execute blockmap-share --remote --file schema.sql --yes
      - name: Cloudflare に公開
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          [ -n "$url" ] || { echo "::error::公開先のアドレスがわかりませんでした。Cloudflare の画面で「Workers & Pages」を一度開いて workers.dev のサブドメインを決めてから、もう一度実行してください"; exit 1; }
          echo "招待制のサイト: $url" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/secrets.json"

  deploy:
    needs: [update]
    if: >-
      always() && !cancelled() && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'サイトだけ公開') ||
        needs.update.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 地図データを取得
        run: |
          mkdir -p data
          if git fetch --depth 1 origin map-data; then git archive FETCH_HEAD | tar -x -C data; fi
      - name: 公開するファイルをまとめる
        run: python3 tools/build_site.py data _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Another deployment may still be finishing; wait a little and try again instead of failing.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 公開をもう一度試す
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
