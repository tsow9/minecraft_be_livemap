name: Map site
# Everything this does is in tools/ci/run.sh: this file only fetches the repository and runs it, handing over the
# repository's secrets and variables. It never needs to change, so a copy of Blockmap can update itself from the
# site's admin menu (GitHub does not let an automatic update change workflow files).
#
# A run started by hand is titled by what it does ("Sign in to Realms", "Update map"), which also lets the live check
# and the setup page tell a sign-in apart. Other runs keep GitHub's usual title.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.action || '' }}

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options: [Sign in to Realms, Update map, Publish site only, Update Blockmap, Diagnose]
        default: Sign in to Realms

permissions:
  contents: write
  actions: write

# A push (new site code) has its own group, so a waiting map update cannot drop it. Map updates run one at a time.
concurrency:
  group: map-site-${{ github.event_name == 'push' && 'push' || 'map' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALMS_CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}
          VARS_JSON: ${{ toJSON(vars) }}
          ACTION: ${{ inputs.action }}
        run: |
          git clone -q --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" blockmap
          cd blockmap
          bash tools/ci/run.sh map
