name: 地図サイト

# Runs only on this repository's own main branch, schedule, or manual start.
# There is deliberately no pull_request trigger, so outside contributions never see the login secret.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: やること
        type: choice
        options: [地図を更新, Realmsにログイン, サイトだけ公開, 診断]
        default: 地図を更新

permissions:
  contents: read

concurrency:
  group: map-site
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  login:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'Realmsにログイン'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Realmsにログイン(下に出るコードを入力してください)
        run: node tools/realms/login.js
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}

  diagnose:
    if: github.event_name == 'workflow_dispatch' && inputs.action == '診断'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Realmsのメンバー情報を調べる
        run: node tools/realms/inspect.js
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - name: ワールドをダウンロード
        run: node tools/realms/download.js world.mcworld members.json
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
      - name: ワールドの中のプレイヤー情報を調べる
        env:
          CHECK: ${{ vars.CHECK_SPOT }}
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # to compare hashed account IDs with the members' (only counts are shown)
        run: |
          pip install --quiet numpy pillow
          python3 tools/inspect_world.py world.mcworld

  update:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.action == '地図を更新')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --prefix tools/realms --no-audit --no-fund
      - name: Realmsからワールドをダウンロード
        id: download
        # Before the first 「Realmsにログイン」 there is nothing to do yet: say so, without failing every hour.
        run: |
          if [ ! -f .auth/token.enc ] || [ -z "$CACHE_KEY" ]; then
            echo "::notice::まだ「Realmsにログイン」をしていないので、地図は作りません(Actions の「地図サイト」から実行してください)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          node tools/realms/download.js world.mcworld members.json
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          REALM_NAME: ${{ vars.REALM_NAME }}
          MC_VERSION: ${{ vars.MC_VERSION }}
      - name: 新しくなったログイン情報を保存
        if: steps.download.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: .auth/token.enc
          key: realms-auth-${{ hashFiles('.auth/token.enc') }}
      - name: 前回の地図データを取得
        if: steps.download.outputs.ready == 'true'
        run: bash tools/vault.sh get map-data data
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
      - name: ワールドか地図の描き方が変わったか確認
        id: compare
        if: steps.download.outputs.ready == 'true'
        # Fingerprint = world + drawing code, so a color fix re-renders even if nobody played.
        run: |
          echo "${{ steps.download.outputs.world_hash }}-$(cat tools/*.py | sha256sum | cut -c1-64)" > fingerprint.txt
          if [ -f data/world.sha256 ] && [ "$(cat data/world.sha256)" = "$(cat fingerprint.txt)" ]; then
            echo "前回から変化なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.compare.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 地図を作る
        if: steps.compare.outputs.changed == 'true'
        env:
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}  # pet owners are stored as the same hashed keys live.json uses
        run: |
          pip install --quiet numpy pillow
          live=""
          bash tools/vault.sh get live-data live
          [ -f live/live.json ] && live=live/live.json
          python tools/render_map.py --world world.mcworld --site data --snapshot "$(date +%F)" --live "$live"
          cp fingerprint.txt data/world.sha256
      - name: 地図データを保存(暗号化して)
        if: steps.compare.outputs.changed == 'true'
        # map-data keeps a single commit so the repository does not grow with every hourly update.
        run: bash tools/vault.sh put data map-data
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}

  # The invite-only site on Cloudflare (worker/): the site, the map data in a hidden folder, and the shared pins.
  cloudflare:
    needs: [update]
    if: >-
      always() && !cancelled() && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.action == 'サイトだけ公開') ||
        needs.update.outputs.changed == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}
      CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
    steps:
      - name: 設定の確認
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$SHARE_PASSPHRASE" ] && [ -n "$CACHE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cloudflare の Secrets がそろっていないので、招待制のサイトは作りません"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - name: 鍵を用意(ログには伏せ字で出ます)
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/site_keys.py "$RUNNER_TEMP"
      - name: 地図データを取得
        if: steps.check.outputs.ready == 'true'
        run: bash tools/vault.sh get map-data data
      - name: 公開するファイルをまとめる
        if: steps.check.outputs.ready == 'true'
        run: python3 tools/build_site.py data _site --data-folder "$(cat "$RUNNER_TEMP/data_dir")" --items-folder "$(cat "$RUNNER_TEMP/items_dir")"
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: 準備
        if: steps.check.outputs.ready == 'true'
        run: npm ci --prefix worker --no-audit --no-fund
      - name: データベースを用意
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          find_db() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const l=JSON.parse(s);const d=l.find(x=>x.name==="blockmap-share");process.stdout.write(d?d.uuid:"")})'; }
          id=$(find_db)
          if [ -z "$id" ]; then
            npx wrangler d1 create blockmap-share
            id=$(find_db)
          fi
          [ -n "$id" ] || { echo "::error::データベースを作れませんでした"; exit 1; }
          sed -e "s/__DB_ID__/$id/" wrangler.template.toml > wrangler.toml
          npx wrangler d1 execute blockmap-share --remote --file schema.sql --yes
      - name: Cloudflare に公開
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json" | tee deploy.log
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          [ -n "$url" ] || { echo "::error::公開先のアドレスがわかりませんでした。Cloudflare の画面で「Workers & Pages」を一度開いて workers.dev のサブドメインを決めてから、もう一度実行してください"; exit 1; }
          echo "招待制のサイト: $url" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/secrets.json"
      - name: 前のアドレスのサイトを片づける
        # This site's earlier workers: the first pin server (blockmap-share) and the members-only site's first address
        # (blockmap.<subdomain>.workers.dev, now map.…). Only the workers go; the database stays. Only for this repository,
        # so nobody else's worker of the same name is touched.
        if: steps.check.outputs.ready == 'true' && github.repository == 'tsow9/minecraft_be_livemap'
        continue-on-error: true
        run: |
          for old in blockmap-share blockmap; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$old")
            case "$code" in
              200) echo "前のサイト($old)を削除しました" ;;
              404) echo "前のサイト($old)はもうありません" ;;
              *) echo "::warning::前のサイト($old)を削除できませんでした($code)" ;;
            esac
          done
      - name: ログインの記録(件数だけ)
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        continue-on-error: true
        run: |
          # How many sign-ins were made each day, and how many devices stay signed in. Counts only, nobody's name or id.
          npx wrangler d1 execute blockmap-share --remote --json --command \
            "SELECT date(created / 1000, 'unixepoch') AS day, COUNT(*) AS n FROM sessions GROUP BY day ORDER BY day DESC LIMIT 14" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s)[0].results;console.log("ログインした回数(日ごと):");for(const x of r)console.log(`  ${x.day}: ${x.n}回`)})'

  # GitHub Pages keeps only two pages: a notice that the map has moved (to the members-only site on Cloudflare), and
  # login.html, the page every Blockmap site's Microsoft sign-in comes back through. No map data is published here.
  # Only in this project's own repository: copies have no GitHub Pages and need none.
  deploy:
    if: >-
      github.repository == 'tsow9/minecraft_be_livemap' && (
        github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'サイトだけ公開')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 公開するファイルをまとめる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir _site
          cp login.html favicon.svg _site/
          url=$(bash tools/site_url.sh)
          sed "s#__SITE__#${url:-}#" tools/moved.html > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Another deployment may still be finishing; wait a little and try again instead of failing.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: 公開をもう一度試す
        if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
