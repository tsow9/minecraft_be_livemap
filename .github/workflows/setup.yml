name: Setup
# Only for a new copy of Blockmap, while it is being set up (see tools/setup_wait.sh):
#  - on its first commits, "wait" watches for the Cloudflare token for up to 45 minutes;
#  - each minute it starts this workflow by hand ("probe"), which starts signing in once the token is there.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

env:
  BLOCKMAP_LANG: ${{ vars.LANGUAGE || 'ja' }}

concurrency:
  group: setup-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  wait:
    # Not in this project's own repository, which is set up already.
    if: github.event_name == 'push' && github.repository != 'tsow9/minecraft_be_livemap'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Cloudflare token
        run: bash tools/setup_wait.sh
        env:
          GH_TOKEN: ${{ github.token }}

  probe:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - name: Start signing in if the token is there
        run: bash tools/auto_signin.sh
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
