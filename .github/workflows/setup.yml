name: Setup
# Only for a new copy of Blockmap, while it is being set up: from its first commit it watches for the Cloudflare token
# and starts signing in once it is there (tools/setup_wait.sh). Everything this does is in tools/ci/run.sh: this file
# never needs to change (see map.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: setup-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REALMS_CACHE_KEY: ${{ secrets.REALMS_CACHE_KEY }}
          SHARE_PASSPHRASE: ${{ secrets.SHARE_PASSPHRASE }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          git clone -q --depth 1 --branch "$GITHUB_REF_NAME" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" blockmap
          cd blockmap
          bash tools/ci/run.sh setup
