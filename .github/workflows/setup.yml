name: Setup
# Only for a new copy of Blockmap, while it is being set up: from its first commit it watches for the Cloudflare token
# and starts signing in once it is there (tools/setup_wait.sh). Everything this does is in tools/ci/run.sh: this file
# never needs to change (see map.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: setup-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Run
        env:
          GH_TOKEN: ${{ github.token }}
          SECRETS_JSON: ${{ toJSON(secrets) }}
          VARS_JSON: ${{ toJSON(vars) }}
        run: |
          git clone -q --depth 1 --branch "$GITHUB_REF_NAME" "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" blockmap
          cd blockmap
          bash tools/ci/run.sh setup
