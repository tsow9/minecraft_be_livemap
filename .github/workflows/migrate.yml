name: Move the sign-in
# One time, Blockmap's own repository only: the Realms sign-in moves from GitHub's Actions cache to the site's
# Cloudflare database (tools/ci/d1.py), where the new runs keep it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  move:
    if: github.repository == 'tsow9/minecraft_be_livemap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .auth/token.enc
          key: realms-auth-restore-${{ github.run_id }}
          restore-keys: realms-auth-
      - name: Move it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -s .auth/token.enc
          base64 -w0 .auth/token.enc | python3 tools/ci/d1.py put realms_auth
          test -n "$(python3 tools/ci/d1.py get realms_auth)" && echo "Moved"
